name: Release

# 버전 태그(v0.1.0)를 올리면 테스트를 돌리고 macOS 앱을 빌드해 GitHub 릴리스에 올린다.
# 앱 버전은 태그(MAJOR.MINOR.PATCH), 빌드 번호는 이 워크플로의 실행 번호다.
# ponytail: 개발자 인증서가 없어 ad-hoc 서명이라 받은 사람이 격리 속성을 지워야 열린다. 없애려면 유료 계정으로 Developer ID 서명·공증 단계를 더한다.
# iOS 는 유료 계정 없이 기기에 설치할 길이 없어 올리지 않는다.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  macos:
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: swift test --package-path ChristofKit
      - run: >
          xcodebuild -project Christof.xcodeproj -scheme Christof -configuration Release
          -destination 'generic/platform=macOS' -derivedDataPath build
          MARKETING_VERSION=${GITHUB_REF_NAME#v} CURRENT_PROJECT_VERSION=${{ github.run_number }} build
      # ad-hoc 서명의 기본 신원은 빌드마다 바뀌는 cdhash 라, macOS 위치 서비스가 업데이트한 앱을 다른 앱으로 보고 등록을 끝내지 않는다.
      # 앱과 위젯을 번들 id 신원으로 다시 서명해 버전이 바뀌어도 같은 앱으로 보이게 한다. Xcode 서명 옵션으로 주면 Sparkle 프레임워크까지 같은 신원이 붙어 서명이 깨진다.
      # ponytail: 번들 id 만 보는 신원이라 같은 id 를 단 다른 앱과 구별하지 못한다. Developer ID 로 서명하면 인증서 기반 신원으로 바꾼다.
      - run: |
          app=build/Build/Products/Release/Christof.app
          codesign -f -s - --preserve-metadata=entitlements -r='designated => identifier "com.christof.Christof.Widget"' "$app/Contents/PlugIns/ChristofWidgetExtension.appex"
          codesign -f -s - --preserve-metadata=entitlements -r='designated => identifier "com.christof.Christof"' "$app"
          codesign --verify --deep --strict "$app"
      - run: ditto -c -k --keepParent build/Build/Products/Release/Christof.app Christof-macOS.zip
      # 앱의 Sparkle 이 releases/latest/download/appcast.xml 을 읽어 새 버전을 찾는다. 개발자 인증서가 없어 zip 의 EdDSA 서명만으로 업데이트를 믿는다.
      # 개인키는 만든 Mac 의 로그인 키체인(계정 christof)과 이 secret 에만 있다. 잃으면 기존 앱은 더 업데이트되지 않아 install.sh 로 다시 설치해야 한다.
      - run: |
          enclosure=$(echo "$SPARKLE_PRIVATE_KEY" | build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - Christof-macOS.zip)
          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Christof</title>
              <item>
                <title>${GITHUB_REF_NAME#v}</title>
                <pubDate>$(date -R)</pubDate>
                <sparkle:version>${{ github.run_number }}</sparkle:version>
                <sparkle:shortVersionString>${GITHUB_REF_NAME#v}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                <enclosure url="https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/Christof-macOS.zip" type="application/octet-stream" $enclosure/>
              </item>
            </channel>
          </rss>
          EOF
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      - run: gh release create "$GITHUB_REF_NAME" Christof-macOS.zip appcast.xml --generate-notes --notes "$NOTES"
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            ## macOS 설치 (macOS 26 이상)
            터미널에서 실행합니다. 이미 설치돼 있으면 이 버전으로 바꿉니다.
            ```sh
            curl -fsSL https://raw.githubusercontent.com/zzzinho/Christof/main/install.sh | sh -s -- ${{ github.ref_name }}
            ```
            그다음 바탕화면을 우클릭하고 "위젯 편집"에서 Christof 위젯을 놓습니다.

            ## 삭제
            ```sh
            curl -fsSL https://raw.githubusercontent.com/zzzinho/Christof/main/uninstall.sh | sh
            ```
