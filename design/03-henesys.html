<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>헤네시스</title>
<link rel="stylesheet" href="design.css">
</head>
<body>
<header>
  <h1>헤네시스</h1>
  <p>헤네시스 테마 페이지. 메이플스토리의 궁수 마을이다. 창밖은 멀리 청록 산맥과 앞의 알록달록한 큰 버섯집, 낮에 가끔 지나는 뿔버섯·초록버섯, 창틀은 버섯집 나무 창, 고양이 자리에는 주황버섯, 평소 옷은 화살통을 멘 초록 궁수 튜닉이다. 벽·책상·시계·스탠드와 이벤트(한국 명절·기념일, 해·달)는 기본 테마와 같다. 테마는 지역과 따로 고르므로 해·달·날씨는 장면 지역 값이다. 그리기 코드는 00-base 에 있다.</p>
</header>
<main>
  <h2>창밖·창틀</h2>
  <div id="outside" class="part"></div>
  <h2>주황버섯</h2>
  <div id="pet" class="part"></div>
  <h2>사람</h2>
  <div id="person" class="part"></div>
  <h2>장면</h2>
  <div id="scenes"></div>
</main>

<script>
// 테마 설정만 둔다. 그리기 코드와 페이지 모양은 00-base.html 에서 받아 쓴다(hunsu 는 따로 둔 .js 를 서빙하지 못한다).
const THEME_PAGE = {
  theme: 'henesys',
  intents: {
    outside: {
      part: '메이플스토리 헤네시스 배경(grassySoil)과 공식 아트를 따른다. 멀리 뾰족한 청록 산맥, 그 앞 둥근 초록 언덕, 앞에는 알록달록한 큰 버섯집(주황·빨강·노랑 갓에 크림색 점, 둥근 창, 지붕창)이 창을 채운다. 아파트 샷시는 한국 아파트로 읽혀 위 모서리가 둥근 버섯집 나무 창으로 바꾼다.',
      때: { row: '밤에는 버섯집 창과 지붕창에 불이 켜져 어두운 언덕에서도 마을이 읽힌다. 낮은 메이플처럼 맑고 밝다.' },
      날씨: { row: '비·눈·안개에서도 버섯 갓 모양이 읽혀야 한다. 눈이 오면 갓 위에 눈이 얹힌다.' },
      몬스터: { row: '헤네시스 사냥터의 뿔버섯·초록버섯이 낮에 가끔 집 앞을 지나 마을이 살아 있게 한다. 창밖 풍경이라 윤곽선은 두르지 않는다.' },
      계절: { row: '하얀 줄기 나무의 잎으로 계절을 보인다. 기본 테마 가로수와 같은 색 규칙이고, 잎이 버섯집 갓 위로 올라오게 줄기를 길게 세운다.' },
      '기본과 비교': { row: '같은 장면에서 창밖과 창틀만 헤네시스로 바뀌는지 기본과 나란히 본다.' },
    },
    pet: {
      part: '고양이 자리에 헤네시스 대표 몬스터 주황버섯을 둔다. 주황 갓에 노란 점, 크림색 몸통, 점 눈만으로 주황버섯으로 읽히게 한다. 자세와 자리는 고양이와 같다.',
      상태: { row: '고양이와 같은 하루(따로·같이·밥)를 보낸다. 버섯은 앞뒤가 같은 모양이라 눈으로 방향을 보이고, 걸을 때는 메이플 버섯처럼 통통 뛴다.' },
      불: { row: '해가 지면 갓 오른쪽에 스탠드 테두리 빛이 진다.' },
      '겨울 목도리': { row: '고양이처럼 겨울에는 요일 색 목도리를 갓 아래에 두른다.' },
      이벤트: { row: '모자는 갓 위에, 곁 물건은 고양이와 같은 자리에 둔다.' },
    },
    person: {
      part: '헤네시스는 궁수 마을이라 평소 옷을 궁수 차림으로 바꾼다. 뒷모습이라 옷 색만으로는 궁수로 읽히지 않아 화살통을 멘다.',
      '평소 옷': { row: '초록 튜닉의 등 위쪽 그늘이 내려놓은 후드로 읽히고, 허리에 가죽 띠, 오른쪽 어깨에서 비스듬히 멘 화살통과 머리 옆으로 솟은 화살깃이 있다.' },
      '헤드폰·머리': { row: '화살통은 머리 위에 얹어 머리가 길어도 보인다.' },
      이벤트: { row: '이벤트 날은 기본 테마와 같은 옷이라 화살통이 없다.' },
    },
  },
};

fetch('00-base.html').then(response => response.text()).then(html => {
  document.head.insertAdjacentHTML('beforeend', html.match(/<style>[\s\S]*?<\/style>/)[0]);
  const script = document.createElement('script');
  script.textContent = `${html.match(/<script>([\s\S]*)<\/script>/)[1].split('// ---- 00-base 페이지 ----')[0]}\nthemePage(THEME_PAGE);`;
  document.body.append(script);
});
</script>
</body>
</html>
